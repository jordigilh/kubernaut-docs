<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <line x1="71" y1="0" x2="71" y2="140" stroke="#EE0000" stroke-width="1.5"/>
  <line x1="71" y1="1008" x2="71" y2="1080" stroke="#EE0000" stroke-width="1.5"/>
  <text x="85" y="35" font-family="'Red Hat Display', Arial, sans-serif" font-weight="400" font-size="14px" fill="#6A6E73">Kubernaut</text>
  <defs>
    <linearGradient id="tG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488"/><stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="bG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="aG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <filter id="shL" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.1"/>
    </filter>
  </defs>
  <text x="139" y="60" font-family="'Red Hat Display', Arial, sans-serif" font-size="11px" font-weight="600" fill="#EE0000" letter-spacing="1.5">AGENTIC PLATFORM</text>
  <text x="139" y="225" font-family="'Red Hat Display', Arial, sans-serif" font-weight="700" font-size="34px" fill="#151515">Architecture Overview</text>
  <text x="139" y="257" font-family="'Red Hat Text', Arial, sans-serif" font-size="16px" fill="#6A6E73">Kubernaut exposes MCP and A2A endpoints &#x2014; any compliant agent or UI connects</text>
  <!-- YOUR PLATFORM zone -->
  <g filter="url(#shL)">
    <rect x="100" y="265" width="1720" height="200" rx="14" fill="white" stroke="#6A6E73" stroke-width="2" stroke-dasharray="8,4"/>
  </g>
  <rect x="100" y="265" width="1720" height="36" rx="14" fill="#6A6E73" opacity="0.06"/>
  <text x="130" y="291" font-family="'Red Hat Display', Arial, sans-serif" font-size="14px" font-weight="700" fill="#6A6E73" letter-spacing="1">EXTERNAL CONSUMERS</text>

  <g filter="url(#sh)"><rect x="132" y="315" width="392" height="110" rx="12" fill="white" stroke="#6A6E73" stroke-width="1.5"/></g>
  <text x="328" y="365" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="17px" font-weight="600" fill="#151515">Chat / NL Interface</text>
  <text x="328" y="391" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" fill="#6A6E73">Natural language</text>

  <g filter="url(#sh)"><rect x="554" y="315" width="392" height="110" rx="12" fill="white" stroke="#6A6E73" stroke-width="1.5"/></g>
  <text x="750" y="365" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="17px" font-weight="600" fill="#151515">AI Agent</text>
  <text x="750" y="391" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" fill="#6A6E73">Orchestration + intent</text>

  <g filter="url(#sh)"><rect x="976" y="315" width="392" height="110" rx="12" fill="white" stroke="#6A6E73" stroke-width="1.5"/></g>
  <text x="1172" y="365" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="17px" font-weight="600" fill="#151515">Dashboards</text>
  <text x="1172" y="391" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" fill="#6A6E73">Monitoring + status</text>

  <g filter="url(#sh)"><rect x="1398" y="315" width="392" height="110" rx="12" fill="white" stroke="#6A6E73" stroke-width="1.5"/></g>
  <text x="1594" y="365" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="17px" font-weight="600" fill="#151515">Auth &amp; Policy</text>
  <text x="1594" y="391" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" fill="#6A6E73">Users, RBAC, tenancy</text>
  <!-- Protocol bridge -->
  <line x1="960" y1="465" x2="960" y2="525" stroke="#151515" stroke-width="2.5"/>
  <polygon points="960,525 952,511 968,511" fill="#151515"/>
  <rect x="990" y="491" width="200" height="30" rx="15" fill="#151515" opacity="0.06"/>
  <text x="1090" y="512" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="13px" font-weight="700" fill="#151515" letter-spacing="0.8">MCP / A2A</text>
  <!-- KUBERNAUT zone: single box -->
  <g filter="url(#shL)">
    <rect x="100" y="545" width="1720" height="330" rx="14" fill="white" stroke="#EE0000" stroke-width="2" stroke-dasharray="8,4"/>
  </g>
  <rect x="100" y="545" width="1720" height="36" rx="14" fill="#EE0000" opacity="0.04"/>
  <text x="130" y="571" font-family="'Red Hat Display', Arial, sans-serif" font-size="14px" font-weight="700" fill="#EE0000" letter-spacing="1">KUBERNAUT (IN-CLUSTER)</text>
  <text x="1760" y="571" font-family="'Red Hat Text', Arial, sans-serif" font-size="12px" fill="#6A6E73" text-anchor="end">Managed by Kubernaut</text>

  <!-- API Frontend -->
  <g filter="url(#sh)"><rect x="460" y="601" width="1000" height="70" rx="12" fill="#6A6E73"/></g>
  <text x="960" y="634" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="17px" font-weight="600" fill="white">API Frontend</text>
  <text x="960" y="658" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="12px" fill="white" opacity="0.8">MCP server  |  A2A endpoint  |  CRD watcher  |  SSE streaming</text>

  <!-- Single Kubernaut Engine box -->
  <g filter="url(#sh)"><rect x="260" y="701" width="1400" height="150" rx="14" fill="#151515"/></g>
  <rect x="260" y="701" width="1400" height="6" rx="3" fill="#EE0000"/>
  <text x="960" y="737" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="22px" font-weight="700" fill="white">Kubernaut Engine</text>
  <line x1="460" y1="751" x2="1460" y2="751" stroke="white" stroke-width="1" stroke-opacity="0.3"/>

  <g font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" fill="white" fill-opacity="0.85">
    <text x="460" y="781" text-anchor="middle">Investigate</text>
    <text x="700" y="781" text-anchor="middle">Orchestrate</text>
    <text x="960" y="781" text-anchor="middle">Remediate</text>
    <text x="1220" y="781" text-anchor="middle">Monitor</text>
    <text x="1460" y="781" text-anchor="middle">Enforce</text>
  </g>

  <g font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="white" fill-opacity="0.55">
    <text x="460" y="801" text-anchor="middle">LLM RCA + tools</text>
    <text x="700" y="801" text-anchor="middle">CRD lifecycle</text>
    <text x="960" y="801" text-anchor="middle">Tekton / Ansible</text>
    <text x="1220" y="801" text-anchor="middle">Health + scoring</text>
    <text x="1460" y="801" text-anchor="middle">OPA safety gates</text>
  </g>

  <!-- Arrow from API Frontend to Engine -->
  <line x1="960" y1="671" x2="960" y2="701" stroke="#A3A6A9" stroke-width="2"/>
  <polygon points="960,701 954,689 966,689" fill="#A3A6A9"/>
</svg>