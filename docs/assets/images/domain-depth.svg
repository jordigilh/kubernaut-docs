<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Chrome -->
  <line x1="71" y1="0" x2="71" y2="140" stroke="#EE0000" stroke-width="1.5"/>
  <line x1="71" y1="1008" x2="71" y2="1080" stroke="#EE0000" stroke-width="1.5"/>
  <text x="85" y="35" font-family="'Red Hat Display', Arial, sans-serif" font-weight="400" font-size="14px" fill="#6A6E73">Kubernaut</text>

  <g transform="translate(0, 5)">
  <!-- Title (stays at RH standard position) -->
  <text x="139" y="180" font-family="'Red Hat Display', Arial, sans-serif" font-weight="700" font-size="34px" fill="#151515">The Depth of K8s Remediation</text>
  <text x="139" y="212" font-family="'Red Hat Text', Arial, sans-serif" font-weight="400" font-size="18px" fill="#6A6E73">Detection and investigation are table stakes. Execution and verification are not.</text>

  <!-- Waterline (full-width, stays fixed) -->
  <line x1="100" y1="570" x2="1800" y2="570" stroke="#6A6E73" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- Content block: iceberg + zones + waterline text + tagline, centered -->
  <g transform="translate(190, 0)">

  <!-- Iceberg: clip paths for 4 zones -->
  <defs>
    <clipPath id="zone1"><rect x="0" y="0" width="1920" height="380"/></clipPath>
    <clipPath id="zone2"><rect x="0" y="380" width="1920" height="160"/></clipPath>
    <clipPath id="zone3"><rect x="0" y="540" width="1920" height="170"/></clipPath>
    <clipPath id="zone4"><rect x="0" y="710" width="1920" height="250"/></clipPath>
  </defs>

  <!-- Iceberg triangle outline -->
  <polygon points="375,260 130,860 620,860" fill="none" stroke="#A3A6A9" stroke-width="1.5"/>

  <!-- Zone fills (progressively deeper) -->
  <polygon points="375,260 130,860 620,860" fill="#EE0000" opacity="0.10" clip-path="url(#zone1)"/>
  <polygon points="375,260 130,860 620,860" fill="#EE0000" opacity="0.15" clip-path="url(#zone2)"/>
  <polygon points="375,260 130,860 620,860" fill="#151515" opacity="0.08" clip-path="url(#zone3)"/>
  <polygon points="375,260 130,860 620,860" fill="#151515" opacity="0.14" clip-path="url(#zone4)"/>

  <!-- Waterline label -->
  <text x="632" y="563" font-family="'Red Hat Text', Arial, sans-serif" font-weight="400" font-size="11px" fill="#6A6E73" font-style="italic">waterline — what the market covers today</text>

  <!-- ===== Zone annotations (right side, with accent bars) ===== -->

  <!-- Zone 1: Signal Intake -->
  <rect x="700" y="286" width="4" height="78" rx="2" fill="#A3A6A9"/>
  <text x="718" y="304" font-family="'Red Hat Display', Arial, sans-serif" font-weight="700" font-size="18px" fill="#151515">1. Signal Intake</text>
  <text x="718" y="326" font-family="'Red Hat Text', Arial, sans-serif" font-weight="400" font-size="13px" fill="#151515">AlertManager webhooks, K8s Events, Rego classification, fingerprint dedup</text>
  <text x="718" y="344" font-family="'Red Hat Text', Arial, sans-serif" font-size="12px" font-style="italic" fill="#6A6E73">Industry standard — Prometheus, Datadog, Dynatrace, any alerting stack</text>
  <text x="718" y="360" font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="#A3A6A9">Commoditized. Every monitoring platform does this.</text>

  <!-- Zone 2: Investigation -->
  <rect x="700" y="420" width="4" height="100" rx="2" fill="#6A6E73"/>
  <text x="718" y="438" font-family="'Red Hat Display', Arial, sans-serif" font-weight="700" font-size="18px" fill="#151515">2. Investigation</text>
  <text x="718" y="460" font-family="'Red Hat Text', Arial, sans-serif" font-weight="400" font-size="13px" fill="#151515">LLM + 36 client-go tools, Prometheus queries, owner chain, remediation history</text>
  <text x="718" y="478" font-family="'Red Hat Text', Arial, sans-serif" font-size="12px" font-style="italic" fill="#6A6E73">Predictive AI covers this — Dynatrace Davis, Datadog Watchdog, Komodor Klaudia</text>
  <text x="718" y="496" font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="#A3A6A9">Statistical models correlate known patterns. GenAI (Kubernaut) reasons about novel failures.</text>
  <text x="718" y="514" font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="#A3A6A9">HolmesGPT diagnoses but does not execute. Klaudia investigates with multi-agent architecture.</text>

  <!-- Zone 3: Execution -->
  <rect x="700" y="588" width="4" height="100" rx="2" fill="#EE0000"/>
  <text x="718" y="606" font-family="'Red Hat Display', Arial, sans-serif" font-weight="700" font-size="18px" fill="#151515">3. Execution</text>
  <text x="718" y="628" font-family="'Red Hat Text', Arial, sans-serif" font-weight="400" font-size="13px" fill="#151515">Tekton, K8s Jobs, Ansible/AWX — policy-gated (OPA/Rego), declarative CRD workflows</text>
  <text x="718" y="646" font-family="'Red Hat Text', Arial, sans-serif" font-size="12px" font-style="italic" fill="#EE0000">Few solutions — no pre-approved catalog, no per-remediation approval</text>
  <text x="718" y="664" font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="#A3A6A9">Klaudia: agent-generated remediation, no workflow catalog. Datadog Bits AI: fixed error patterns only.</text>
  <text x="718" y="680" font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="#A3A6A9">Kubernaut: LLM selects from pre-authored, versioned, auditable RemediationWorkflow CRDs.</text>

  <!-- Zone 4: Closing the Loop -->
  <rect x="700" y="752" width="4" height="100" rx="2" fill="#151515"/>
  <text x="718" y="770" font-family="'Red Hat Display', Arial, sans-serif" font-weight="700" font-size="18px" fill="#151515">4. Closing the Loop</text>
  <text x="718" y="792" font-family="'Red Hat Text', Arial, sans-serif" font-weight="400" font-size="13px" fill="#151515">4-dimension effectiveness scoring, structured feedback loop, SOC2 audit trail</text>
  <text x="718" y="810" font-family="'Red Hat Text', Arial, sans-serif" font-weight="600" font-size="12px" font-style="italic" fill="#EE0000">Kubernaut unique — no competitor covers this</text>
  <text x="718" y="828" font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="#A3A6A9">Pod health + alert resolution + metrics improvement + spec drift detection.</text>
  <text x="718" y="846" font-family="'Red Hat Text', Arial, sans-serif" font-size="11px" fill="#A3A6A9">Per-remediation effectiveness feeds future LLM investigations. Failed fixes trigger alternatives.</text>

  <!-- Tagline -->
  <text x="0" y="930" font-family="'Red Hat Text', Arial, sans-serif" font-weight="400" font-size="14px" fill="#6A6E73">Kubernaut covers the full depth — from signal to verified outcome. Trust Ladder + Agentic UI (v1.4+) bridge the adoption gap.</text>

  </g><!-- end content center -->
  </g><!-- end vertical shift -->

</svg>