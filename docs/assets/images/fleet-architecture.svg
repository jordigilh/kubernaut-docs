  <text x="698" y="364" text-anchor="middle" font-size="10.5px" fill="#64748B">verify + learn</text>

  <!-- Notification -->
  <rect x="780" y="284" width="52" height="52" rx="12" fill="#DB2777"/>
  <circle cx="806" cy="293" r="1.8" fill="white"/>
