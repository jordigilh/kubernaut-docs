<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 210 1580 450">
  <rect x="170" y="210" width="1580" height="450" fill="#FFFFFF"/>

  <defs>
    <filter id="sh" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <filter id="shL" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.1"/>
    </filter>
  </defs>
  <g transform="translate(0, 50)">

  <!-- ====== HUB CLUSTER ====== -->
  <g filter="url(#shL)">
    <rect x="200" y="170" width="1520" height="200" rx="14" fill="white" stroke="#151515" stroke-width="2"/>
  </g>
  <rect x="200" y="170" width="1520" height="36" rx="14" fill="#151515" opacity="0.06"/>
  <text x="230" y="196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14px" font-weight="700" fill="#151515" letter-spacing="1">OCM Hub</text>

  <!-- OCM Hub + Thanos -->
  <rect x="240" y="220" width="300" height="90" rx="10" fill="#151515" opacity="0.06"/>
  <text x="390" y="250" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15px" font-weight="600" fill="#151515">OCM Monitoring Plane</text>
  <text x="390" y="270" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#6A6E73">Thanos + Alertmanager</text>
  <text x="390" y="290" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#A3A6A9">Centralized metrics</text>

  <!-- Kubernaut Engine -->
  <rect x="600" y="220" width="420" height="90" rx="10" fill="#0891B2" opacity="0.08"/>
  <text x="810" y="254" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17px" font-weight="700" fill="#0891B2">Kubernaut Engine</text>
  <text x="810" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#6A6E73">GW | KA | RO | WE | DS</text>

  <!-- Keycloak -->
  <rect x="1080" y="220" width="220" height="90" rx="10" fill="#6A6E73" opacity="0.08"/>
  <text x="1190" y="254" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15px" font-weight="600" fill="#6A6E73">Keycloak</text>
  <text x="1190" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#6A6E73">JWT identity</text>

  <!-- AWX -->
  <rect x="1360" y="220" width="320" height="90" rx="10" fill="#6A6E73" opacity="0.06"/>
  <text x="1520" y="254" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15px" font-weight="600" fill="#6A6E73">AWX</text>
  <text x="1520" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#6A6E73">Remote execution</text>

  <!-- Hub footer -->
  <text x="240" y="340" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#A3A6A9">CRDs + Scope Service on hub  |  clusterUUID routing  |  SHA256 fingerprinting</text>

  <!-- Connection lines from hub down to clusters -->
  <line x1="480" y1="370" x2="480" y2="440" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="480,440 474,430 486,430" fill="#0891B2"/>
  <line x1="960" y1="370" x2="960" y2="440" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="960,440 954,430 966,430" fill="#0891B2"/>
  <line x1="1440" y1="370" x2="1440" y2="440" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="1440,440 1434,430 1446,430" fill="#0891B2"/>

  <!-- ====== REMOTE CLUSTER 1 ====== -->
  <g filter="url(#sh)">
    <rect x="260" y="450" width="440" height="90" rx="12" fill="white" stroke="#0891B2" stroke-width="2"/>
  </g>
  <text x="480" y="478" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14px" font-weight="700" fill="#151515">prod-us-east</text>
  <text x="480" y="498" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#6A6E73">MCP + klusterlet + Prometheus</text>
  <text x="480" y="516" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#0891B2">No Kubernaut CRDs, no controllers</text>

  <!-- ====== REMOTE CLUSTER 2 ====== -->
  <g filter="url(#sh)">
    <rect x="740" y="450" width="440" height="90" rx="12" fill="white" stroke="#0891B2" stroke-width="2"/>
  </g>
  <text x="960" y="478" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14px" font-weight="700" fill="#151515">prod-eu-west</text>
  <text x="960" y="498" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#6A6E73">MCP + klusterlet + Prometheus</text>
  <text x="960" y="516" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#0891B2">No Kubernaut CRDs, no controllers</text>

  <!-- ====== REMOTE CLUSTER 3 ====== -->
  <g filter="url(#sh)">
    <rect x="1220" y="450" width="440" height="90" rx="12" fill="white" stroke="#0891B2" stroke-width="2"/>
  </g>
  <text x="1440" y="478" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14px" font-weight="700" fill="#151515">prod-ap-south</text>
  <text x="1440" y="498" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#6A6E73">MCP + klusterlet + Prometheus</text>
  <text x="1440" y="516" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#0891B2">No Kubernaut CRDs, no controllers</text>

  <!-- ====== STEP ANNOTATIONS ====== -->

  <!-- Step 1: Remote Prometheus → Thanos -->
  <circle cx="390" cy="420" r="12" fill="#0891B2"/>
  <text x="390" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="12px" font-weight="700" fill="white">1</text>

  <!-- Step 2: Alertmanager → Kubernaut Engine -->
  <line x1="540" y1="265" x2="600" y2="265" stroke="#D97706" stroke-width="2"/>
  <polygon points="600,265 592,260 592,270" fill="#D97706"/>
  <circle cx="570" cy="245" r="12" fill="#D97706"/>
  <text x="570" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="12px" font-weight="700" fill="white">2</text>

  <!-- Step 3: Engine → Keycloak (JWT for investigation) -->
  <line x1="1020" y1="265" x2="1080" y2="265" stroke="#6366F1" stroke-width="2"/>
  <polygon points="1080,265 1072,260 1072,270" fill="#6366F1"/>
  <circle cx="1050" cy="245" r="12" fill="#6366F1"/>
  <text x="1050" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="12px" font-weight="700" fill="white">3</text>

  <!-- Step 4: Engine → Remote cluster (MCP investigation) -->
  <circle cx="810" cy="420" r="12" fill="#0891B2"/>
  <text x="810" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="12px" font-weight="700" fill="white">4</text>

  <!-- Step 5: Engine → Keycloak (JWT for remediation) -->
  <circle cx="1050" cy="295" r="12" fill="#6366F1"/>
  <text x="1050" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="12px" font-weight="700" fill="white">5</text>

  <!-- Step 6: Engine → AWX (dispatch playbook) -->
  <line x1="1300" y1="265" x2="1360" y2="265" stroke="#059669" stroke-width="2"/>
  <polygon points="1360,265 1352,260 1352,270" fill="#059669"/>
  <circle cx="1330" cy="245" r="12" fill="#059669"/>
  <text x="1330" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="12px" font-weight="700" fill="white">6</text>

  <!-- Zero credentials bar -->
  <rect x="200" y="570" width="1520" height="46" rx="10" fill="#0891B2" opacity="0.04" stroke="#0891B2" stroke-width="1"/>
  <text x="960" y="599" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14px" font-weight="600" fill="#0891B2">Zero persistent credentials on remote clusters &#x2014; ephemeral SAs with OCM-managed lifecycle</text>

  </g>
</svg>
