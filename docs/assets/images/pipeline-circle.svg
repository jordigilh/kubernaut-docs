<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" font-family="Inter, sans-serif">
  <defs>
    <style>
      .phase-circle { opacity: 0.82; }
      .phase-label { font-weight: 700; font-size: 15px; fill: #fff; text-anchor: middle; }
      .phase-sub { font-weight: 400; font-size: 10.5px; fill: rgba(255,255,255,0.9); text-anchor: middle; }
      .crd-label { font-weight: 600; font-size: 9px; fill: rgba(255,255,255,0.75); text-anchor: middle; font-family: "JetBrains Mono", monospace; }
      .center-title { font-weight: 700; font-size: 16px; fill: #333; text-anchor: middle; }
      .center-sub { font-weight: 400; font-size: 10px; fill: #888; text-anchor: middle; }
      .arrow { fill: none; stroke: #999; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
  </defs>

  <!-- Phase 1: Signal Processing (top) -->
  <circle class="phase-circle" cx="350" cy="175" r="115" fill="#0891B2"/>
  <text class="phase-label" x="350" y="155"><tspan>Signal</tspan></text>
  <text class="phase-label" x="350" y="173">Processing</text>
  <text class="phase-sub" x="350" y="193">Ingest ù Classify</text>
  <text class="crd-label" x="350" y="210">SignalProcessing</text>

  <!-- Phase 2: AI Analysis (right) -->
  <circle class="phase-circle" cx="517" cy="296" r="115" fill="#6366F1"/>
  <text class="phase-label" x="517" y="278">AI Analysis</text>
  <text class="phase-sub" x="517" y="296">Two-Invocation Pipeline</text>
  <text class="phase-sub" x="517" y="310">36 tools ù catalog match</text>
  <text class="crd-label" x="517" y="327">AIAnalysis</text>

  <!-- Phase 3: Approval (bottom-right) -->
  <circle class="phase-circle" cx="453" cy="480" r="115" fill="#0F172A"/>
  <text class="phase-label" x="453" y="462">Approval</text>
  <text class="phase-sub" x="453" y="480">Policy-Gated ù Safety</text>
  <text class="phase-sub" x="453" y="494">OPA/Rego ù operator override</text>
  <text class="crd-label" x="453" y="511">RemediationApprovalRequest</text>

  <!-- Phase 4: Execution (bottom-left) -->
  <circle class="phase-circle" cx="247" cy="480" r="115" fill="#D97706"/>
  <text class="phase-label" x="247" y="462">Execution</text>
  <text class="phase-sub" x="247" y="480">Tekton ∑ Jobs ∑ Ansible</text>
  <text class="phase-sub" x="247" y="494">Per-workflow SA ∑ TokenRequest</text>
  <text class="crd-label" x="247" y="511">WorkflowExecution</text>

  <!-- Phase 5: Effectiveness (left) -->
  <circle class="phase-circle" cx="183" cy="296" r="115" fill="#059669"/>
  <text class="phase-label" x="183" y="278">Effectiveness</text>
  <text class="phase-sub" x="183" y="296">Verify ù Learn</text>
  <text class="phase-sub" x="183" y="310">Health score ù feeds RCA</text>
  <text class="crd-label" x="183" y="327">EffectivenessAssessment</text>

  <!-- Flow arrows (curved, between circles) -->
  <path class="arrow" d="M 420,120 Q 490,160 480,210"/>
  <path class="arrow" d="M 570,370 Q 550,420 510,440"/>
  <path class="arrow" d="M 390,540 Q 340,550 300,535"/>
  <path class="arrow" d="M 185,430 Q 160,390 165,350"/>
  <path class="arrow" d="M 225,210 Q 260,160 310,135"/>

  <!-- Center text -->
  <text class="center-title" x="350" y="345">Kubernaut</text>
  <text class="center-sub" x="350" y="362">CRD-native ù closed-loop</text>
  <text class="center-sub" x="350" y="376">9 CRDs ù kubectl tooling</text>
</svg>
