<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Red Hat Display, Red Hat Text, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowSm" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="white"/>

  
  <!-- Chrome -->
  <line x1="71" y1="0" x2="71" y2="140" stroke="#EE0000" stroke-width="1.5"/>
  <line x1="71" y1="1008" x2="71" y2="1080" stroke="#EE0000" stroke-width="1.5"/>
  <text x="85" y="35" font-family="'Red Hat Display', Arial, sans-serif" font-weight="400" font-size="14px" fill="#6A6E73">Kubernaut</text>


  <g transform="translate(0, 195)">

  <text x="960" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#151515">The Remediation Pipeline: CRD-Native, End-to-End</text>
  <text x="960" y="90" text-anchor="middle" font-size="20" fill="#151515">Every phase is a Kubernetes CRD with status transitions. All state in etcd, all communication CRD-native.</text>

  <!-- PHASE 1: Signal Processing (SP) -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="300" height="380" rx="16" fill="white"/>
  </g>
  <rect x="40" y="120" width="300" height="56" rx="16" fill="#151515"/>
  <rect x="40" y="160" width="300" height="16" fill="#151515"/>
  <rect x="56" y="130" width="36" height="24" rx="6" fill="white" opacity="0.25"/>
  <text x="74" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="white">SP</text>
  <text x="102" y="152" font-size="18" font-weight="700" fill="white">Signal Processing</text>
  <circle cx="318" cy="148" r="16" fill="white" opacity="0.2"/>
  <text x="318" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="white">1</text>

  <text x="60" y="200" font-size="15" font-weight="600" fill="#EE0000">Multi-Source Ingestion</text>
  <text x="60" y="220" font-size="13" fill="#151515">AlertManager webhooks</text>
  <text x="60" y="238" font-size="13" fill="#151515">Kubernetes Events (native watch)</text>
  <text x="60" y="256" font-size="13" fill="#151515">NL signal extraction (v1.5)</text>
  <line x1="60" y1="270" x2="320" y2="270" stroke="#F0F0F0" stroke-width="1"/>
  <text x="60" y="292" font-size="15" font-weight="600" fill="#EE0000">Rego Classification</text>
  <text x="60" y="312" font-size="13" fill="#151515">Severity (critical/warning/info)</text>
  <text x="60" y="330" font-size="13" fill="#151515">Category to workflow families</text>
  <text x="60" y="348" font-size="13" fill="#151515">OPA policy at intake</text>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(350, 300)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#A3A6A9" stroke-width="3"/>
    <polygon points="30,0 22,-6 22,6" fill="#A3A6A9"/>
    <text x="15" y="-8" text-anchor="middle" font-size="10" fill="#A3A6A9">RR</text>
  </g>

  <!-- PHASE 2: AI Analysis (AA) -->
  <g filter="url(#shadow)">
    <rect x="390" y="120" width="440" height="380" rx="16" fill="white"/>
  </g>
  <rect x="390" y="120" width="440" height="56" rx="16" fill="#151515"/>
  <rect x="390" y="160" width="440" height="16" fill="#151515"/>
  <rect x="406" y="130" width="36" height="24" rx="6" fill="white" opacity="0.25"/>
  <text x="424" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="white">AA</text>
  <text x="452" y="152" font-size="18" font-weight="700" fill="white">AI Analysis</text>
  <text x="580" y="152" font-size="13" fill="rgba(255,255,255,0.8)">(2 LLM + 1 server-side)</text>
  <circle cx="808" cy="148" r="16" fill="white" opacity="0.2"/>
  <text x="808" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="white">2</text>

  <!-- Sub-phase: RCA -->
  <g filter="url(#shadowSm)">
    <rect x="406" y="192" width="132" height="294" rx="10" fill="#F5F5F5"/>
  </g>
  <rect x="406" y="192" width="132" height="30" rx="10" fill="#EE0000" opacity="0.08"/>
  <rect x="406" y="214" width="132" height="8" fill="#F5F5F5"/>
  <text x="472" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#EE0000">RCA</text>
  <g font-size="11.5" fill="#151515">
    <text x="416" y="240">LLM + native Go</text>
    <text x="416" y="256">client-go tools:</text>
    <text x="416" y="278" font-size="11" fill="#EE0000">Resource inspection</text>
    <text x="416" y="294" font-size="11" fill="#EE0000">Pod log analysis</text>
    <text x="416" y="310" font-size="11" fill="#EE0000">Event correlation</text>
    <text x="416" y="326" font-size="11" fill="#EE0000">Prometheus queries</text>
    <text x="416" y="346" font-size="11" fill="#EE0000">Owner chain context</text>
    <text x="416" y="370" fill="#151515">36 tools total</text>
    <text x="416" y="386" fill="#151515">(all via client-go</text>
    <text x="416" y="402" fill="#151515">and HTTP APIs)</text>
  </g>

  <!-- Sub-phase: Enrichment -->
  <g filter="url(#shadowSm)">
    <rect x="548" y="192" width="132" height="294" rx="10" fill="#F5F5F5"/>
  </g>
  <rect x="548" y="192" width="132" height="30" rx="10" fill="#EE0000" opacity="0.08"/>
  <rect x="548" y="214" width="132" height="8" fill="#F5F5F5"/>
  <text x="614" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#EE0000">Enrichment</text>
  <g font-size="11.5" fill="#151515">
    <text x="558" y="240">Server-side context</text>
    <text x="558" y="256">gathering:</text>
    <text x="558" y="278">Owner chain root</text>
    <text x="558" y="294">Related events</text>
    <text x="558" y="310">Metric trends</text>
    <text x="558" y="326">Remediation history</text>
    <text x="558" y="346">Resource state</text>
    <text x="558" y="370">Builds NL summary</text>
    <text x="558" y="386">for operators and</text>
    <text x="558" y="402">downstream phases</text>
  </g>

  <!-- Sub-phase: Workflow Selection -->
  <g filter="url(#shadowSm)">
    <rect x="690" y="192" width="132" height="294" rx="10" fill="#F5F5F5"/>
  </g>
  <rect x="690" y="192" width="132" height="30" rx="10" fill="#EE0000" opacity="0.08"/>
  <rect x="690" y="214" width="132" height="8" fill="#F5F5F5"/>
  <text x="756" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#EE0000">Wf Selection</text>
  <g font-size="11.5" fill="#151515">
    <text x="700" y="240">LLM best-match from</text>
    <text x="700" y="256">user-declared</text>
    <text x="700" y="270">workflows:</text>
    <text x="700" y="286">Declarative CRD</text>
    <text x="700" y="300">manifests</text>
    <text x="700" y="316">Scored ranking</text>
    <text x="700" y="332">Parameter extraction</text>
    <text x="700" y="350">Top candidates</text>
    <text x="700" y="366">to approval gate</text>
    <text x="700" y="382">User-extensible</text>
  </g>

  <!-- Internal arrows -->
  <g transform="translate(539, 330)"><polygon points="8,0 2,-4 2,4" fill="#EE0000" opacity="0.4"/></g>
  <g transform="translate(681, 330)"><polygon points="8,0 2,-4 2,4" fill="#EE0000" opacity="0.4"/></g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(840, 300)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#A3A6A9" stroke-width="3"/>
    <polygon points="30,0 22,-6 22,6" fill="#A3A6A9"/>
    <text x="15" y="-8" text-anchor="middle" font-size="10" fill="#A3A6A9">AA</text>
  </g>

  <!-- PHASE 3: Remediation Approval Request (RAR) -->
  <g filter="url(#shadow)">
    <rect x="880" y="120" width="260" height="380" rx="16" fill="white"/>
  </g>
  <rect x="880" y="120" width="260" height="56" rx="16" fill="#EE0000"/>
  <rect x="880" y="160" width="260" height="16" fill="#EE0000"/>
  <rect x="896" y="130" width="40" height="24" rx="6" fill="white" opacity="0.25"/>
  <text x="916" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="white">RAR</text>
  <text x="946" y="152" font-size="18" font-weight="700" fill="white">Approval</text>
  <circle cx="1118" cy="148" r="16" fill="white" opacity="0.2"/>
  <text x="1118" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="white">3</text>

  <rect x="896" y="196" width="228" height="44" rx="8" fill="#F5F5F5" stroke="#EE0000" stroke-opacity="0.3" stroke-width="1"/>
  <text x="906" y="216" font-size="14" font-weight="600" fill="#EE0000">Auto-approve</text>
  <text x="906" y="232" font-size="12" fill="#151515">Policy-matching, low-risk workflows</text>

  <rect x="896" y="250" width="228" height="44" rx="8" fill="#F5F5F5" stroke="#EE0000" stroke-opacity="0.3" stroke-width="1"/>
  <text x="906" y="270" font-size="14" font-weight="600" fill="#EE0000">Manual approval</text>
  <text x="906" y="286" font-size="12" fill="#151515">Operator review (Slack / Console)</text>

  <rect x="896" y="304" width="228" height="44" rx="8" fill="#F5F5F5" stroke="#EE0000" stroke-opacity="0.3" stroke-width="1"/>
  <text x="906" y="324" font-size="14" font-weight="600" fill="#EE0000">Operator override</text>
  <text x="906" y="340" font-size="12" fill="#151515">Change params at approval time</text>

  <line x1="896" y1="362" x2="1124" y2="362" stroke="#F0F0F0" stroke-width="1"/>
  <text x="896" y="384" font-size="14" font-weight="600" fill="#EE0000">Safety</text>
  <text x="896" y="404" font-size="12" fill="#151515">OPA/Rego policy enforcement</text>
  <text x="896" y="420" font-size="12" fill="#151515">Namespace-scoped RBAC</text>
  <text x="896" y="436" font-size="12" fill="#151515">Full audit trail</text>
  <text x="896" y="452" font-size="12" fill="#151515">Configurable per severity</text>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(1150, 300)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#A3A6A9" stroke-width="3"/>
    <polygon points="30,0 22,-6 22,6" fill="#A3A6A9"/>
    <text x="15" y="-8" text-anchor="middle" font-size="10" fill="#A3A6A9">RAR</text>
  </g>

  <!-- PHASE 4: Workflow Execution (WFE) -->
  <g filter="url(#shadow)">
    <rect x="1190" y="120" width="270" height="380" rx="16" fill="white"/>
  </g>
  <rect x="1190" y="120" width="270" height="56" rx="16" fill="#6A6E73"/>
  <rect x="1190" y="160" width="270" height="16" fill="#6A6E73"/>
  <rect x="1206" y="130" width="44" height="24" rx="6" fill="white" opacity="0.25"/>
  <text x="1228" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="white">WFE</text>
  <text x="1260" y="152" font-size="18" font-weight="700" fill="white">Execution</text>
  <circle cx="1438" cy="148" r="16" fill="white" opacity="0.2"/>
  <text x="1438" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="white">4</text>

  <text x="1206" y="200" font-size="14" font-weight="600" fill="#EE0000">Execution Targets</text>
  <rect x="1206" y="212" width="238" height="36" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1218" y="236" font-size="13" font-weight="600" fill="#151515">Tekton Pipelines</text>
  <rect x="1206" y="256" width="238" height="36" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1218" y="280" font-size="13" font-weight="600" fill="#151515">Kubernetes Jobs</text>
  <rect x="1206" y="300" width="238" height="36" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1218" y="324" font-size="13" font-weight="600" fill="#151515">Ansible / AWX / AAP</text>

  <line x1="1206" y1="350" x2="1444" y2="350" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1206" y="372" font-size="14" font-weight="600" fill="#EE0000">Security Model</text>
  <text x="1206" y="392" font-size="12" fill="#151515">Per-workflow ServiceAccount</text>
  <text x="1206" y="408" font-size="12" fill="#151515">Least-privilege RBAC</text>
  <text x="1206" y="424" font-size="12" fill="#151515">TokenRequest short-lived auth</text>
  <text x="1206" y="440" font-size="12" fill="#151515">User-declared workflow manifests</text>

  <!-- Arrow 4 to 5 -->
  <g transform="translate(1470, 300)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#A3A6A9" stroke-width="3"/>
    <polygon points="30,0 22,-6 22,6" fill="#A3A6A9"/>
    <text x="15" y="-8" text-anchor="middle" font-size="10" fill="#A3A6A9">WFE</text>
  </g>

  <!-- PHASE 5: Effectiveness Assessment (EA) -->
  <g filter="url(#shadow)">
    <rect x="1510" y="120" width="370" height="380" rx="16" fill="white"/>
  </g>
  <rect x="1510" y="120" width="370" height="56" rx="16" fill="#6A6E73"/>
  <rect x="1510" y="160" width="370" height="16" fill="#6A6E73"/>
  <rect x="1526" y="130" width="36" height="24" rx="6" fill="white" opacity="0.25"/>
  <text x="1544" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="white">EA</text>
  <text x="1572" y="152" font-size="18" font-weight="700" fill="white">Effectiveness</text>
  <circle cx="1858" cy="148" r="16" fill="white" opacity="0.2"/>
  <text x="1858" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="white">5</text>

  <text x="1526" y="200" font-size="14" font-weight="600" fill="#EE0000">Verification Checks</text>
  <rect x="1526" y="212" width="338" height="36" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1538" y="236" font-size="13" font-weight="600" fill="#151515">Alert resolution confirmed</text>
  <rect x="1526" y="256" width="338" height="36" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1538" y="280" font-size="13" font-weight="600" fill="#151515">Spec hash drift detection</text>
  <rect x="1526" y="300" width="338" height="36" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1538" y="324" font-size="13" font-weight="600" fill="#151515">Cooldown monitoring</text>

  <line x1="1526" y1="350" x2="1864" y2="350" stroke="#F0F0F0" stroke-width="1"/>
  <text x="1526" y="372" font-size="14" font-weight="600" fill="#EE0000">Feedback Loop</text>
  <text x="1526" y="392" font-size="12" fill="#151515">Health scoring (0-100%)</text>
  <text x="1526" y="408" font-size="12" fill="#151515">Scores fed into future investigations</text>
  <text x="1526" y="424" font-size="12" fill="#151515">Recurrence detection</text>
  <text x="1526" y="440" font-size="12" fill="#151515">Outcome persisted for future RCA</text>

  <!-- Cross-cutting services -->
  <g filter="url(#shadowSm)">
    <rect x="40" y="524" width="1840" height="76" rx="12" fill="white"/>
  </g>
  <rect x="52" y="534" width="890" height="56" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <rect x="52" y="534" width="5" height="56" rx="2" fill="#EE0000"/>
  <text x="72" y="556" font-size="15" font-weight="700" fill="#151515">Notification Service</text>
  <text x="230" y="556" font-size="13" fill="#151515">(NR CRD)</text>
  <text x="72" y="578" font-size="12" fill="#151515">Approval, completion, escalation, manual review, self-resolved, bulk dedup: Slack, PagerDuty, Teams</text>

  <rect x="958" y="534" width="910" height="56" rx="8" fill="#F5F5F5" stroke="#F0F0F0" stroke-width="1"/>
  <rect x="958" y="534" width="5" height="56" rx="2" fill="#151515"/>
  <text x="978" y="556" font-size="15" font-weight="700" fill="#151515">DataStorage + Audit</text>
  <text x="1150" y="556" font-size="13" fill="#151515">(PostgreSQL + Valkey)</text>
  <text x="978" y="578" font-size="12" fill="#151515">Every LLM call, tool invocation, decision, approval, and outcome persisted with correlation IDs</text>

  <!-- Dashed connectors -->
  <line x1="190" y1="500" x2="190" y2="524" stroke="#EE0000" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="610" y1="500" x2="610" y2="524" stroke="#EE0000" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1010" y1="500" x2="1010" y2="524" stroke="#EE0000" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1325" y1="500" x2="1325" y2="524" stroke="#EE0000" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1695" y1="500" x2="1695" y2="524" stroke="#EE0000" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- CRD summary footer -->
  <rect x="40" y="618" width="1840" height="36" rx="8" fill="#F5F5F5"/>
  <text x="960" y="641" text-anchor="middle" font-size="14" font-weight="600" fill="#151515">RR (RemediationRequest) orchestrates the full lifecycle  |  9 CRDs  |  All state in etcd  |  Standard kubectl tooling</text>

  </g>

</svg>
