<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Red Hat Display', 'Red Hat Text', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="white"/>

  <!-- RH Chrome -->
  <line x1="71" y1="0" x2="71" y2="140" stroke="#EE0000" stroke-width="1.5"/>
  <line x1="71" y1="1008" x2="71" y2="1080" stroke="#EE0000" stroke-width="1.5"/>
  <text x="85" y="35" font-family="'Red Hat Display', Arial, sans-serif" font-weight="400" font-size="14px" fill="#6A6E73">Kubernaut</text>

  <!-- Title -->
  <text x="960" y="130" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="36px" font-weight="700" fill="#151515">The Remediation Pipeline</text>
  <text x="960" y="168" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="18px" fill="#6A6E73">5 phases, all CRD-native, all state in etcd, standard kubectl tooling</text>

  <!-- ===== Phase boxes ===== -->
  <!-- Each box: 300w, 400h, gap 40, starting at x=60 -->

  <!-- Phase 1: Signal Processing -->
  <g filter="url(#sh)">
    <rect x="60" y="240" width="300" height="440" rx="14" fill="white"/>
  </g>
  <rect x="60" y="240" width="300" height="56" rx="14" fill="#151515"/>
  <rect x="60" y="282" width="300" height="14" fill="#151515"/>
  <circle cx="338" cy="268" r="16" fill="white" opacity="0.2"/>
  <text x="338" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="white">1</text>
  <text x="90" y="274" font-family="'Red Hat Display', Arial, sans-serif" font-size="18px" font-weight="700" fill="white">Signal Processing</text>

  <text x="90" y="330" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">Ingest</text>
  <text x="90" y="354" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">AlertManager webhooks</text>
  <text x="90" y="376" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Kubernetes Events</text>

  <line x1="90" y1="418" x2="330" y2="418" stroke="#F0F0F0" stroke-width="1"/>

  <text x="90" y="446" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">Classify</text>
  <text x="90" y="470" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">OPA/Rego severity classification</text>
  <text x="90" y="492" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Category-to-workflow mapping</text>

  <rect x="90" y="530" width="240" height="44" rx="8" fill="#F5F5F5"/>
  <text x="210" y="558" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" font-weight="600" fill="#6A6E73">CRD: RemediationRequest</text>

  <!-- Arrow 1-2 -->
  <line x1="370" y1="460" x2="408" y2="460" stroke="#A3A6A9" stroke-width="3"/>
  <polygon points="408,460 398,454 398,466" fill="#A3A6A9"/>

  <!-- Phase 2: AI Analysis -->
  <g filter="url(#sh)">
    <rect x="420" y="240" width="300" height="440" rx="14" fill="white"/>
  </g>
  <rect x="420" y="240" width="300" height="56" rx="14" fill="#151515"/>
  <rect x="420" y="282" width="300" height="14" fill="#151515"/>
  <circle cx="698" cy="268" r="16" fill="white" opacity="0.2"/>
  <text x="698" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="white">2</text>
  <text x="450" y="274" font-family="'Red Hat Display', Arial, sans-serif" font-size="18px" font-weight="700" fill="white">AI Analysis</text>

  <text x="450" y="330" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">3-Phase Pipeline</text>
  <text x="450" y="356" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">1. LLM investigates with 36</text>
  <text x="462" y="376" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">native Go tools (client-go)</text>
  <text x="450" y="402" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">2. Server-side enrichment</text>
  <text x="462" y="422" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">(context, history, metrics)</text>
  <text x="450" y="448" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">3. LLM selects best workflow</text>
  <text x="462" y="468" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">from user-declared catalog</text>

  <rect x="450" y="530" width="240" height="44" rx="8" fill="#F5F5F5"/>
  <text x="570" y="558" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" font-weight="600" fill="#6A6E73">CRD: AiAnalysis</text>

  <!-- Arrow 2-3 -->
  <line x1="730" y1="460" x2="768" y2="460" stroke="#A3A6A9" stroke-width="3"/>
  <polygon points="768,460 758,454 758,466" fill="#A3A6A9"/>

  <!-- Phase 3: Approval -->
  <g filter="url(#sh)">
    <rect x="780" y="240" width="300" height="440" rx="14" fill="white"/>
  </g>
  <rect x="780" y="240" width="300" height="56" rx="14" fill="#EE0000"/>
  <rect x="780" y="282" width="300" height="14" fill="#EE0000"/>
  <circle cx="1058" cy="268" r="16" fill="white" opacity="0.2"/>
  <text x="1058" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="white">3</text>
  <text x="810" y="274" font-family="'Red Hat Display', Arial, sans-serif" font-size="18px" font-weight="700" fill="white">Approval</text>

  <text x="810" y="330" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">Policy-Gated</text>
  <text x="810" y="356" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Auto-approve low-risk actions</text>
  <text x="810" y="378" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Manual review via Slack/Console</text>
  <text x="810" y="400" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Operator can override params</text>

  <line x1="810" y1="420" x2="1050" y2="420" stroke="#F0F0F0" stroke-width="1"/>

  <text x="810" y="448" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">Safety</text>
  <text x="810" y="472" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">OPA/Rego policy enforcement</text>
  <text x="810" y="494" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Namespace-scoped RBAC</text>

  <rect x="810" y="530" width="240" height="44" rx="8" fill="#F5F5F5"/>
  <text x="930" y="558" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" font-weight="600" fill="#6A6E73">CRD: RemediationApprovalReq</text>

  <!-- Arrow 3-4 -->
  <line x1="1090" y1="460" x2="1128" y2="460" stroke="#A3A6A9" stroke-width="3"/>
  <polygon points="1128,460 1118,454 1118,466" fill="#A3A6A9"/>

  <!-- Phase 4: Execution -->
  <g filter="url(#sh)">
    <rect x="1140" y="240" width="300" height="440" rx="14" fill="white"/>
  </g>
  <rect x="1140" y="240" width="300" height="56" rx="14" fill="#6A6E73"/>
  <rect x="1140" y="282" width="300" height="14" fill="#6A6E73"/>
  <circle cx="1418" cy="268" r="16" fill="white" opacity="0.2"/>
  <text x="1418" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="white">4</text>
  <text x="1170" y="274" font-family="'Red Hat Display', Arial, sans-serif" font-size="18px" font-weight="700" fill="white">Execution</text>

  <text x="1170" y="330" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">3 Engines</text>
  <text x="1170" y="358" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Tekton Pipelines</text>
  <text x="1170" y="380" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Kubernetes Jobs</text>
  <text x="1170" y="402" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Ansible / AWX / AAP</text>

  <line x1="1170" y1="422" x2="1410" y2="422" stroke="#F0F0F0" stroke-width="1"/>

  <text x="1170" y="450" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">Security Model</text>
  <text x="1170" y="474" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Per-workflow ServiceAccount</text>
  <text x="1170" y="496" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Short-lived TokenRequest auth</text>

  <rect x="1170" y="530" width="240" height="44" rx="8" fill="#F5F5F5"/>
  <text x="1290" y="558" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" font-weight="600" fill="#6A6E73">CRD: WorkflowExecution</text>

  <!-- Arrow 4-5 -->
  <line x1="1450" y1="460" x2="1488" y2="460" stroke="#A3A6A9" stroke-width="3"/>
  <polygon points="1488,460 1478,454 1478,466" fill="#A3A6A9"/>

  <!-- Phase 5: Effectiveness -->
  <g filter="url(#sh)">
    <rect x="1500" y="240" width="360" height="440" rx="14" fill="white"/>
  </g>
  <rect x="1500" y="240" width="360" height="56" rx="14" fill="#6A6E73"/>
  <rect x="1500" y="282" width="360" height="14" fill="#6A6E73"/>
  <circle cx="1838" cy="268" r="16" fill="white" opacity="0.2"/>
  <text x="1838" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="white">5</text>
  <text x="1530" y="274" font-family="'Red Hat Display', Arial, sans-serif" font-size="18px" font-weight="700" fill="white">Effectiveness</text>

  <text x="1530" y="330" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">Verify</text>
  <text x="1530" y="356" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Alert resolution confirmed</text>
  <text x="1530" y="378" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Drift detection after fix</text>
  <text x="1530" y="400" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Cooldown monitoring</text>

  <line x1="1530" y1="420" x2="1830" y2="420" stroke="#F0F0F0" stroke-width="1"/>

  <text x="1530" y="448" font-family="'Red Hat Text', Arial, sans-serif" font-size="15px" font-weight="600" fill="#EE0000">Learn</text>
  <text x="1530" y="474" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Health scoring (0-100%)</text>
  <text x="1530" y="496" font-family="'Red Hat Text', Arial, sans-serif" font-size="14px" fill="#151515">Outcomes feed future RCA</text>

  <rect x="1530" y="530" width="300" height="44" rx="8" fill="#F5F5F5"/>
  <text x="1680" y="558" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="13px" font-weight="600" fill="#6A6E73">CRD: EffectivenessAssessment</text>

  <!-- Bottom bar -->
  <rect x="60" y="720" width="1800" height="50" rx="10" fill="#F5F5F5"/>
  <text x="960" y="752" text-anchor="middle" font-family="'Red Hat Display', Arial, sans-serif" font-size="15px" font-weight="600" fill="#151515">9 CRDs  |  All communication via CRD status transitions  |  Every decision persisted  |  Standard kubectl tooling</text>

  <!-- Detailed version note -->
  <text x="960" y="800" text-anchor="middle" font-family="'Red Hat Text', Arial, sans-serif" font-size="12px" fill="#A3A6A9">See Appendix for detailed sub-phase breakdown</text>
</svg>
