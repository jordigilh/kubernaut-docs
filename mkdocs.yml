site_name: Kubernaut
site_url: https://jordigilh.github.io/kubernaut-docs/
site_description: AIOps Platform for Intelligent Kubernetes Remediation
site_author: Kubernaut Contributors
repo_url: https://github.com/jordigilh/kubernaut
repo_name: jordigilh/kubernaut
edit_uri: ""

copyright: Copyright &copy; 2026 Kubernaut Contributors

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: teal
    accent: amber
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - toc.integrate

extra:
  # chart_version tracks kubernaut's CHART_VERSION file (Helm chart packaging
  # version, published to oci://quay.io/kubernaut-ai/charts/kubernaut), NOT
  # the app release below — the two are intentionally decoupled upstream
  # (kubernaut commit 55bd533ca) and only bump together occasionally. Verify
  # against the registry before bumping: `crane manifest quay.io/kubernaut-ai/charts/kubernaut:<version>`
  chart_version: "1.6.0"
  # image_tag/operator_image_tag: both quay.io/kubernaut-ai repos tag images
  # with the bare semver (no "v" prefix) -- verified against the live
  # registry (`quay.io/api/v1/repository/kubernaut-ai/<repo>/tag/`) before
  # each bump. image_tag tracks kubernaut's app release; operator_image_tag
  # tracks kubernaut-operator's own, independently-versioned release.
  # 2026-08-23: bumped for v1.6 -- both repos' `main` VERSION/Makefile
  # default to 1.6.0 (kubernaut) / 1.6.0-rc2 (operator) with the latest
  # tags being v1.6.0-rc5 / v1.6.0-rc2 respectively; neither has a final
  # non-RC tag yet. Re-verify against the live registry once v1.6.0 GA
  # images are actually published.
  image_tag: "1.6.0"
  operator_image_tag: "1.6.0"
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jordigilh/kubernaut

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

plugins:
  - search
  - macros

