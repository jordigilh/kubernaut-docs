<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 125 1680 850">
  <rect x="120" y="125" width="1680" height="850" fill="#FFFFFF"/>
  <defs>
    <filter id="ws" x="-2%" y="-1%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="rhH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/><stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
  </defs>


  <!-- Backstage Window -->
  <g filter="url(#ws)">
    <rect x="139" y="140" width="1642" height="820" rx="8" fill="#222427"/>
  </g>
  <rect x="139" y="140" width="1642" height="44" rx="8" fill="url(#rhH)"/>
  <rect x="139" y="170" width="1642" height="14" fill="url(#rhH)"/>
  <text x="180" y="169" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="15px" fill="#FFFFFF">Backstage</text>

  <!-- Sidebar -->
  <rect x="139" y="184" width="220" height="776" fill="#222427"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#FFFFFF" fill-opacity="0.65">
    <text x="178" y="224">Home</text>
    <text x="178" y="256">Catalog</text>
    <text x="178" y="288">APIs</text>
    <text x="178" y="320">Docs</text>
  </g>
  <line x1="160" y1="340" x2="340" y2="340" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="139" y="355" width="4" height="30" fill="#0891B2"/>
  <rect x="143" y="355" width="216" height="30" fill="#3C3F42"/>
  <text x="178" y="376" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="13px" fill="#FFFFFF">Kubernaut</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" fill="#FFFFFF" fill-opacity="0.45">
    <text x="194" y="408">Fleet Overview</text>
    <text x="194" y="432" fill="#FFFFFF" fill-opacity="1" font-weight="600">Investigations</text>
    <text x="194" y="456">Workflows</text>
    <text x="194" y="480">Clusters</text>
    <text x="194" y="504">Policies</text>
  </g>
  <rect x="359" y="184" width="1422" height="776" fill="#F8F8F8"/>
  <rect x="359" y="184" width="1422" height="42" fill="#FFFFFF"/>
  <line x1="359" y1="226" x2="1781" y2="226" stroke="#C7C7C7" stroke-width="1"/>
  <text x="390" y="211" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#757575">Kubernaut</text>
  <text x="457" y="211" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#757575">/</text>
  <text x="471" y="211" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#757575">Investigations</text>
  <text x="573" y="211" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#757575">/</text>
  <text x="587" y="211" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#151515">payments-oom-crash</text>

  <!-- Alert banner -->
  <rect x="400" y="240" width="1340" height="36" rx="6" fill="#FDEDF0"/>
  <circle cx="418" cy="258" r="7" fill="#E22134"/>
  <text x="418" y="262" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#FFFFFF">!</text>
  <text x="434" y="263" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#7D1007">ALERT</text>
  <text x="480" y="263" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" fill="#7D1007">pods crash-looping in namespace <tspan font-weight="600">payments</tspan>  &#xb7;  prod-east-14  &#xb7;  12 restarts</text>
  <text x="1726" y="263" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#E22134">2m ago</text>

  <!-- Kubernaut response: investigation -->
  <rect x="400" y="290" width="1340" height="140" rx="10" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1"/>
  <circle cx="420" cy="312" r="14" fill="#0891B2" opacity="0.1"/>
  <text x="420" y="317" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#0891B2">K</text>
  <text x="442" y="316" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#151515">Investigating the payments namespace...</text>
  <text x="1726" y="316" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#A3A6A9">just now</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" fill="#475569">
    <text x="420" y="342"><tspan fill="#A3A6A9">&#x25B8;</tspan>  Checked pod status: <tspan font-weight="600">payments-api-7d4f</tspan> &#x2014; 12 restarts in 4 min</text>
    <text x="420" y="362"><tspan fill="#A3A6A9">&#x25B8;</tspan>  Pulled logs: <tspan font-weight="600" fill="#E22134">OOMKilled</tspan> at 512Mi limit</text>
    <text x="420" y="382"><tspan fill="#A3A6A9">&#x25B8;</tspan>  Queried metrics: memory trending up since 14:32 deploy</text>
    <text x="420" y="402"><tspan fill="#A3A6A9">&#x25B8;</tspan>  Traced deploy via ArgoCD: sync triggered by commit <tspan font-weight="600" fill="#0891B2">a3f8c21</tspan> (PR <tspan fill="#0891B2">#347</tspan>) merged 14:30</text>
    <text x="420" y="422" font-weight="600" fill="#151515">Root cause: memory leak from unbounded cache growth introduced in PR #347 (v2.4.0)</text>
  </g>

  <!-- User message -->
  <g transform="translate(1380, 444)">
    <rect x="0" y="0" width="346" height="32" rx="12" fill="#E7F1FF"/>
    <text x="14" y="21" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" fill="#003366">Can you revert that commit? Roll it back via Git.</text>
    <text x="332" y="21" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#A3A6A9">You</text>
  </g>

  <!-- Kubernaut: workflow options -->
  <rect x="400" y="490" width="1340" height="210" rx="10" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1"/>
  <circle cx="420" cy="514" r="14" fill="#0891B2" opacity="0.1"/>
  <text x="420" y="519" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#0891B2">K</text>
  <text x="442" y="518" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#151515">GitOps environment detected &#x2014; I found 2 matching workflows:</text>

  <g filter="url(#sh)">
    <rect x="420" y="536" width="440" height="78" rx="10" fill="white" stroke="#0891B2" stroke-width="2"/>
  </g>
  <circle cx="440" cy="558" r="12" fill="#0891B2" opacity="0.12"/>
  <text x="440" y="563" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="700" fill="#0891B2">G</text>
  <text x="460" y="556" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14px" font-weight="600" fill="#151515">git-revert-v2</text>
  <text x="590" y="556" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#757575">GitRevertCommit</text>
  <text x="460" y="574" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#757575">Revert commit a3f8c21  &#xb7;  ArgoCD auto-sync  &#xb7;  Risk: Low  &#xb7;  ETA: ~3 min</text>
  <rect x="460" y="584" width="90" height="14" rx="4" fill="#0891B2" opacity="0.1"/>
  <text x="505" y="594" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8px" font-weight="600" fill="#0891B2">RECOMMENDED</text>
  <text x="460" y="606" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9px" fill="#166534" font-style="italic">Preferred: fixes root cause in Git source of truth</text>

  <g filter="url(#sh)">
    <rect x="880" y="536" width="440" height="78" rx="10" fill="white" stroke="#C7C7C7" stroke-width="1.5"/>
  </g>
  <circle cx="900" cy="558" r="12" fill="#FF9800" opacity="0.12"/>
  <text x="900" y="563" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="700" fill="#FF9800">M</text>
  <text x="920" y="556" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14px" font-weight="600" fill="#151515">increase-memory-limits-v1</text>
  <text x="1130" y="556" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" fill="#757575">IncreaseMemoryLimits</text>
  <text x="920" y="574" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#757575">512Mi &#x2192; 1Gi  &#xb7;  Risk: Medium  &#xb7;  Treats symptom, not cause</text>
  <text x="920" y="596" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9px" fill="#E22134" font-style="italic">&#x26A0; In-place patch will be overwritten by next ArgoCD sync</text>

  <!-- Execution result -->
  <rect x="420" y="632" width="900" height="56" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="438" y="652" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#166534">&#x2714; Executing git-revert-v2...</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" fill="#475569">
    <text x="438" y="672">Commit reverted  &#xb7;  ArgoCD sync detected  &#xb7;  Pods rolling out  &#xb7;  Health check OK  &#xb7;  Alert resolved  &#xb7;  <tspan font-weight="600" fill="#166534">Payments is healthy.</tspan></text>
  </g>

  <!-- NL Input bar -->
  <rect x="400" y="708" width="1340" height="44" rx="22" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1.5"/>
  <text x="422" y="735" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#A3A6A9">Ask a follow-up or start a new investigation...</text>
  <rect x="1670" y="718" width="56" height="26" rx="13" fill="#0891B2"/>
  <text x="1698" y="736" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="10px" fill="#FFFFFF">Send</text>

  <!-- Follow-up suggestions -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px">
    <text x="400" y="772" fill="#757575">Suggested:</text>
    <rect x="468" y="760" width="200" height="20" rx="10" fill="#0891B2" opacity="0.06"/>
    <text x="568" y="774" text-anchor="middle" fill="#0891B2">"show me the commit diff"</text>
    <rect x="678" y="760" width="210" height="20" rx="10" fill="#0891B2" opacity="0.06"/>
    <text x="783" y="774" text-anchor="middle" fill="#0891B2">"check ArgoCD sync status"</text>
    <rect x="898" y="760" width="240" height="20" rx="10" fill="#0891B2" opacity="0.06"/>
    <text x="1018" y="774" text-anchor="middle" fill="#0891B2">"are there other services on this repo?"</text>
  </g>

  <!-- GitOps annotation -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="139" y="982" font-size="11px" fill="#6A6E73">
      <tspan font-weight="600" fill="#0891B2">&#x25B8; GitOps-aware remediation:</tspan>
      <tspan dx="4">Kubernaut traces deployments back to Git commits via ArgoCD/Flux, and remediates by reverting in Git &#x2014; the cluster auto-syncs to the safe state.</tspan>
    </text>
  </g>
</svg>
